
esphome:
  name: chiefs-dashboard
  friendly_name: Chiefs Command Center

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_CONSOLE_SECONDARY_NONE: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: UART0

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  on_connect:
    then:
      - delay: 10s
      - script.execute: update_nfl_data

time:
  - platform: sntp
    id: system_time
    timezone: Europe/Berlin
    servers:
      - 0.de.pool.ntp.org
      - 1.de.pool.ntp.org
      - 2.de.pool.ntp.org

http_request:
  timeout: 8s
  follow_redirects: true
  useragent: ChiefsCommandCenter/1.0

