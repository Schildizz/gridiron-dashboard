# Touchcontroller der ESP32-4848S040-Boardfamilie: GT911 ueber I2C
i2c:
  id: touchscreen_bus
  sda: GPIO19
  scl:
    number: GPIO45
    ignore_strapping_warning: true
  scan: true
  frequency: 400kHz

touchscreen:
  - platform: gt911
    id: tft_touch
    i2c_id: touchscreen_bus
    display: tft_display
    on_touch:
      then:
        - lambda: |-
            // Jeder Touch weckt das Display, auch bei manuellem Ausschalten.
            if (id(display_sleep_active)) {
              id(display_sleep_active) = false;
              id(touch_woke_display) = true;
              id(display_backlight).turn_on();
              id(tft_display).update();
            }
            id(touch_start_x) = touch.x;
            id(touch_start_y) = touch.y;
            id(touch_last_x) = touch.x;
            id(touch_last_y) = touch.y;
    on_update:
      then:
        - lambda: |-
            for (auto point : touches) {
              if (point.state <= 2) {
                id(touch_last_x) = point.x;
                id(touch_last_y) = point.y;
              } else if (point.state >= 4) {
                id(touch_last_x) = point.x;
                id(touch_last_y) = point.y;
              }
            }
    on_release:
      then:
        - lambda: |-
            // Der Touch, der das Display gerade aufgeweckt hat, soll keine
            // Navigation oder Auswahl ausloesen.
            if (id(touch_woke_display)) {
              id(touch_woke_display) = false;
              return;
            }

            int delta_x = id(touch_last_x) - id(touch_start_x);
            int delta_y = id(touch_last_y) - id(touch_start_y);

            // Vertikal von oben nach unten wischen: Display manuell ausschalten.
            if (delta_y >= 90 && abs(delta_y) > abs(delta_x)) {
              id(display_sleep_active) = true;
              id(display_backlight).turn_off();
              return;
            }

            // Horizontal wischen: durch die vier Hauptseiten navigieren.
            if (abs(delta_x) >= 80 && abs(delta_x) > abs(delta_y)) {
              if (id(dashboard_page) == 4) {
                id(dashboard_page) = 1;
              } else if (delta_x < 0) {
                id(dashboard_page) = (id(dashboard_page) + 1) % 4;
              } else {
                id(dashboard_page) = (id(dashboard_page) + 3) % 4;
              }
              id(tft_display).update();
              return;
            }

            // Tap auf eine News-Karte oeffnet die Detailansicht.
            if (id(dashboard_page) == 1) {
              int x = id(touch_last_x);
              int y = id(touch_last_y);
              if (x >= 20 && x <= 460 && y >= 132 && y <= 218) {
                id(nfl_selected_news) = 0;
                id(dashboard_page) = 4;
              } else if (x >= 20 && x <= 460 && y >= 230 && y <= 308) {
                id(nfl_selected_news) = 1;
                id(dashboard_page) = 4;
              } else if (x >= 20 && x <= 460 && y >= 320 && y <= 398) {
                id(nfl_selected_news) = 2;
                id(dashboard_page) = 4;
              }
            } else if (id(dashboard_page) == 4) {
              id(dashboard_page) = 1;
            }
            id(tft_display).update();

