# ==========================================
# NFL API ABFRAGE
# ==========================================

script:
  - id: update_nfl_data
    mode: single
    then:

      # TEAMÜBERSICHT
      - http_request.get:
          url: https://nfl-fan-app.de/api/team-overview?team=KC
          capture_response: true
          max_response_buffer_size: 16384

          on_response:
            then:
              - if:
                  condition:
                    lambda: return response->status_code == 200;
                  then:
                    - lambda: |-
                        json::parse_json(body, [](JsonObject root) -> bool {
                          if (!root["record"].is<const char*>()) {
                            return false;
                          }

                          id(nfl_record) =
                            root["record"].as<std::string>();

                          if (root["standingSummary"].is<const char*>()) {
                            id(nfl_division) =
                              root["standingSummary"].as<std::string>();
                          }

                          JsonObject next = root["next"];

                          if (!next.isNull()) {
                            if (next["opponentName"].is<const char*>()) {
                              id(nfl_next_opponent) =
                                next["opponentName"].as<std::string>();
                            }

                            if (next["opponent"].is<const char*>()) {
                              id(nfl_next_opponent_code) =
                                next["opponent"].as<std::string>();
                            }

                            if (next["week"].is<int>()) {
                              id(nfl_next_week) =
                                next["week"].as<int>();
                            }

                            if (next["date"].is<const char*>()) {
                              std::string date = next["date"].as<std::string>();
                              if (date.size() >= 10) {
                                id(nfl_next_date) = date.substr(8, 2) + "." +
                                  date.substr(5, 2) + "." + date.substr(0, 4);
                              }
                              if (date.size() >= 16) {
                                int hour = atoi(date.substr(11, 2).c_str());
                                int minute = atoi(date.substr(14, 2).c_str());
                                // API-Zeit ist UTC. Die anstehende Partie liegt im Winter (CET = UTC+1).
                                hour = (hour + 1) % 24;
                                char time_buffer[16];
                                snprintf(time_buffer, sizeof(time_buffer), "%02d:%02d CET", hour, minute);
                                id(nfl_next_kickoff) = time_buffer;
                              }
                            }
                          }

                          JsonObject last = root["last"];

                          if (!last.isNull()) {
                            if (last["opponentName"].is<const char*>()) {
                              id(nfl_last_opponent) =
                                last["opponentName"].as<std::string>();
                            }

                            if (last["teamScore"].is<int>() &&
                                last["opponentScore"].is<int>()) {
                              id(nfl_last_score) =
                                std::to_string(
                                  last["teamScore"].as<int>())
                                + " - " +
                                std::to_string(
                                  last["opponentScore"].as<int>());
                            }
                          }

                          id(nfl_api_ok) = true;
                          return true;
                        });

                  else:
                    - logger.log:
                        format: "Chiefs API HTTP-Fehler: %d"
                        args:
                          - response->status_code

          on_error:
            then:
              - logger.log: "Chiefs Team API nicht erreichbar"

      # LIVE SPIELE
      - http_request.get:
          url: https://nfl-fan-app.de/api/game-situation
          capture_response: true
          max_response_buffer_size: 32768

          on_response:
            then:
              - if:
                  condition:
                    lambda: return response->status_code == 200;
                  then:
                    - lambda: |-
                        json::parse_json(body, [](JsonObject root) -> bool {
                          JsonArray games = root["games"].as<JsonArray>();

                          if (games.isNull()) {
                            return false;
                          }

                          bool found_live = false;

                          for (JsonObject game : games) {
                            JsonObject home = game["home"];
                            JsonObject away = game["away"];

                            std::string home_code =
                              home["code"].as<std::string>();

                            std::string away_code =
                              away["code"].as<std::string>();

                            if (home_code != "KC" && away_code != "KC") {
                              continue;
                            }

                            std::string state =
                              game["state"].as<std::string>();

                            if (state == "in" || state == "live") {
                              bool chiefs_home = (home_code == "KC");

                              std::string opponent =
                                chiefs_home
                                ? away["name"].as<std::string>()
                                : home["name"].as<std::string>();

                              int chiefs_score =
                                chiefs_home
                                ? home["score"].as<int>()
                                : away["score"].as<int>();

                              int opponent_score =
                                chiefs_home
                                ? away["score"].as<int>()
                                : home["score"].as<int>();

                              id(nfl_live_opponent) = opponent;

                              id(nfl_live_opponent_code) =
                                chiefs_home ? away_code : home_code;

                              id(nfl_live_score) =
                                std::to_string(chiefs_score)
                                + " : " +
                                std::to_string(opponent_score);

                              id(nfl_live_period) =
                                game["period"].as<int>();

                              id(nfl_live_clock) =
                                game["clock"].as<std::string>();

                              found_live = true;
                              break;
                            }
                          }

                          id(nfl_live) = found_live;
                          return true;
                        });

                  else:
                    - logger.log:
                        format: "Game API HTTP-Fehler: %d"
                        args:
                          - response->status_code

          on_error:
            then:
              - logger.log: "Game Situation API nicht erreichbar"

      # NFL NEWS - kleiner JSON-Feed, keine grossen Dateien
      - http_request.get:
          url: https://site.api.espn.com/apis/site/v2/sports/football/nfl/news?limit=3
          capture_response: true
          max_response_buffer_size: 49152
          on_response:
            then:
              - if:
                  condition:
                    lambda: return response->status_code == 200;
                  then:
                    - lambda: |-
                        json::parse_json(body, [](JsonObject root) -> bool {
                          JsonArray articles = root["articles"].as<JsonArray>();
                          if (articles.isNull() || articles.size() == 0) return false;
                          int found = 0;
                          for (JsonObject article : articles) {
                            if (!article["headline"].is<const char*>()) continue;
                            std::string full_headline = article["headline"].as<std::string>();
                            std::string headline = full_headline;
                            if (headline.size() > 44) headline = headline.substr(0, 41) + "...";
                            std::string summary = "Open the news page for details.";
                            if (article["description"].is<const char*>()) summary = article["description"].as<std::string>();
                            else if (article["description"].is<JsonObject>() && article["description"]["text"].is<const char*>()) summary = article["description"]["text"].as<std::string>();
                            if (summary.size() > 350) summary = summary.substr(0, 347) + "...";
                            if (found == 0) { id(nfl_news_1) = headline; id(nfl_news_full_1) = full_headline; id(nfl_news_summary_1) = summary; }
                            else if (found == 1) { id(nfl_news_2) = headline; id(nfl_news_full_2) = full_headline; id(nfl_news_summary_2) = summary; }
                            else if (found == 2) { id(nfl_news_3) = headline; id(nfl_news_full_3) = full_headline; id(nfl_news_summary_3) = summary; }
                            found++;
                            if (found >= 3) break;
                          }
                          return found > 0;
                        });
                  else:
                    - logger.log:
                        format: "NFL News HTTP-Fehler: %d"
                        args:
                          - response->status_code
          on_error:
            then:
              - logger.log: "NFL News API nicht erreichbar"

# ==========================================
# AUTOMATISCHE AKTUALISIERUNG
# ==========================================

interval:
  - interval: 5min
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - script.execute: update_nfl_data

  # Hauptseiten werden jetzt manuell per horizontalem Swipe gewechselt.

  # Nightmode 23:00-07:00 plus manueller Display-Schlaf per Swipe-down. Jeder Touch weckt.
  - interval: 1min
    then:
      - lambda: |-
          auto now = id(system_time).now();
          if (!now.is_valid()) return;
          if (now.hour >= 23 || now.hour < 7) {
            if (!id(display_sleep_active)) {
              id(display_sleep_active) = true;
              id(display_backlight).turn_off();
            }
          }
          // Nach 07:00 bleibt ein bereits ausgeschaltetes Display aus,
          // bis ein Touch es aufweckt.

# ==========================================
# DISPLAY
# ==========================================

display:
  - platform: st7701s
    id: tft_display
    update_interval: 60s
    auto_clear_enabled: false

    spi_id: lcd_spi
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: false

    dimensions:
      width: 480
      height: 480

    cs_pin: GPIO39
    de_pin: GPIO18
    hsync_pin: GPIO16
    vsync_pin: GPIO17
    pclk_pin: GPIO21
    pclk_frequency: 12MHz
    pclk_inverted: false

    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20

    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 20

    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCD, 0x00]

    data_pins:
      red: [11, 12, 13, 14, 0]
      green: [8, 20, 3, 46, 9, 10]
      blue: [4, 5, 6, 7, 15]

    lambda: |-
      Color chiefs_red(110, 0, 20);
      Color dark_red(65, 0, 12);
      Color gold(255, 200, 50);
      Color white(255, 255, 255);
      Color panel(35, 15, 20);
      Color muted(190, 170, 170);
      Color green(50, 220, 110);
      Color black(12, 12, 18);
      Color germany_gold(255, 205, 0);
      Color germany_red(221, 0, 0);
      Color madrid_red(170, 20, 45);
      Color spain_gold(255, 190, 0);
      Color blue(20, 60, 130);

      auto draw_team_logo = [&](int x, int y, const std::string &code) {
        if (code == "ARI") it.image(x,y,id(logo_ari));
        else if (code == "ATL") it.image(x,y,id(logo_atl));
        else if (code == "BAL") it.image(x,y,id(logo_bal));
        else if (code == "BUF") it.image(x,y,id(logo_buf));
        else if (code == "CAR") it.image(x,y,id(logo_car));
        else if (code == "CHI") it.image(x,y,id(logo_chi));
        else if (code == "CIN") it.image(x,y,id(logo_cin));
